# Splash connector for Odoo (Gen 3) - development & E2E stack of this branch.
#
# Network "odoo" (172.120.0.0/24, same on every branch: one stack at a time), also attached
# to the external "splashsync" network:
#
#   Service     Host name               IP address      Endpoint
#   odoo        app.odoo.local          172.120.0.10    http://172.120.0.10 (admin / admin, Splash: /splash)
#   toolkit     toolkit.odoo.local      172.120.0.100   http://172.120.0.100 (MCP: /_mcp)
#   db          db.odoo.local           172.120.0.101   postgres://odoo:odoo@db.odoo.local/odoo
#   adminer     db-admin.odoo.local     172.120.0.102   http://172.120.0.102 (Postgres web admin, odoo / odoo)
#
# Images are ready to use: the database is built in the "db" image, nothing is installed at start.
# The "splashsync" network must exist: docker network create splashsync --attachable
# CI: SPLASHPY_PATH points to a Py-Core clone (see .gitlab-ci.yml).

name:       "splash-odoo"

include:
    - "docker/db.yml"
    - "docker/adminer.yml"
    - "docker/odoo.yml"
    - "docker/toolkit.yml"
    - "docker/quality.yml"

networks:
    odoo:
        name:       splash-odoo
        driver:     bridge
        ipam:
            config:
                - subnet: 172.120.0.0/24
    splashsync:
        external:   true
