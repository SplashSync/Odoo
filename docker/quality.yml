# Quality tools (ruff, mypy, pylint-odoo, bandit) in the Odoo image of this branch: the addon is
# checked where it runs, against the real Odoo & splashpy. Not started by "up" (profile "tools").

services:

    quality:
        image:              "${IMAGES:-registry.gitlab.com/splashsync/odoo}/dev:${ODOO_VERSION:-20}"
        profiles:           [ "tools" ]
        build:
            context:        ".."
            dockerfile:     "docker/odoo/Dockerfile"
            target:         "dev"
            args:
                ODOO_VERSION:       "${ODOO_VERSION:-20}"
                POSTGRES_VERSION:   "${POSTGRES_VERSION:-17}"
                SPLASHPY:           "${SPLASHPY:-splashpy>=3.0.0b0,<4}"
        working_dir:        "/opt/splash/src"
        environment:
            MYPYPATH:       "/opt/splash/src"
            RUFF_CACHE_DIR: "/tmp/ruff"
            MYPY_CACHE_DIR: "/tmp/mypy"
        volumes:
            - "..:/opt/splash/src:ro"
            - "../splashsync:/opt/splash/addons/splashsync:ro"
        network_mode:       "none"
