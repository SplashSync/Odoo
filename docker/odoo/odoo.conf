# Odoo configuration for development & tests only.

[options]
addons_path     = /usr/lib/python3/dist-packages/odoo/addons,/opt/splash/addons
data_dir        = /var/lib/odoo-data
db_name         = odoo
dbfilter        = ^odoo$
list_db         = False
admin_passwd    = admin
http_interface  = 0.0.0.0
http_port       = 8069
proxy_mode      = False
without_demo    = True
log_level       = info
