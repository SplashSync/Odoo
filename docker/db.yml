# Postgres with the pre-initialised Odoo database. Host: db.odoo.local - IP: 172.120.0.101
# Built from the Odoo Dockerfile ("db" target). Recreate the container to reset the database.

services:

    db:
        image:              "${IMAGES:-registry.gitlab.com/splashsync/odoo}/db:${ODOO_VERSION:-20}"
        container_name:     "db.odoo.local"
        hostname:           "db.odoo.local"
        build:
            context:        ".."
            dockerfile:     "docker/odoo/Dockerfile"
            target:         "db"
            args:
                ODOO_VERSION:       "${ODOO_VERSION:-20}"
                POSTGRES_VERSION:   "${POSTGRES_VERSION:-17}"
                SPLASHPY:           "${SPLASHPY:-splashpy>=3.0.0b0,<4}"
        networks:
            odoo:           { ipv4_address: 172.120.0.101, aliases: [ db.odoo.local ] }
