# Splash Toolkit 3.0: validator & MCP. Host: toolkit.odoo.local - IP: 172.120.0.100

services:

    toolkit:
        image:              "splashsync/toolkit:3.0"
        container_name:     "toolkit.odoo.local"
        hostname:           "toolkit.odoo.local"
        ports:
            - "127.0.0.1:8080:80"
        volumes:
            - "./toolkit/splash.yaml:/app/config/packages/splash.yaml:ro"
            - "./toolkit/phpunit.xml.dist:/app/phpunit.odoo.xml:ro"
            - "./toolkit/tests:/app/tests/Odoo:ro"
        depends_on:
            odoo:           { condition: service_healthy }
        networks:
            odoo:           { ipv4_address: 172.120.0.100, aliases: [ toolkit.odoo.local ] }
            splashsync:     { aliases: [ toolkit.odoo.local ] }
