# Adminer: web admin of the Postgres database. Host: db-admin.odoo.local - IP: 172.120.0.102
# Login: system "PostgreSQL", server "db.odoo.local", user "odoo", password "odoo", database "odoo".

services:

    adminer:
        image:              "adminer:5"
        container_name:     "db-admin.odoo.local"
        hostname:           "db-admin.odoo.local"
        logging:            { driver: "none" }
        depends_on:
            db:             { condition: service_healthy }
        environment:
            ADMINER_DEFAULT_SERVER:     "db.odoo.local"
            ADMINER_DESIGN:             "pepa-linha"
        ports:
            - "127.0.0.1:8081:8080"
        networks:
            odoo:           { ipv4_address: 172.120.0.102, aliases: [ db-admin.odoo.local ] }
