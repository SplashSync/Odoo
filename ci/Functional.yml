# Toolkit 3.0 validator: images pulled from the registry, the database of the image is ready, the
# addon of the commit is mounted and upgraded at start (ODOO_UPDATE). One run per object type.

toolkit:
    stage:      Functional
    image:      docker:latest
    tags:       [ "Dedicated-Docker" ]
    services:   [ "docker:dind" ]
    variables:
        ODOO_UPDATE:    "1"
        ODOO_DEV:       "0"
    before_script:
        - apk add --no-cache make > /dev/null
        - mkdir -p "$SPLASHPY_PATH" && wget -qO- "$SPLASHPY_ARCHIVE" | tar xz --strip-components=1 -C "$SPLASHPY_PATH"
        - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    script:
        - make pull up
        - make test SUITE=Validator
        - make manifest
    after_script:
        - docker compose logs --no-color > e2e.log || true
        - docker compose --profile tools down -v || true
    artifacts:
        when:   always
        paths:  [ "e2e.log", "splash.json", "splash.yml", "swagger.json" ]
