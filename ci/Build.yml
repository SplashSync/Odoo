# Build & push the images of the branch: only on the version branch (20.0), when the images
# definition changes, on schedules, or on a manual pipeline (Run pipeline, BUILD_IMAGES=1).

images:
    stage:      Build
    image:      docker:latest
    tags:       [ "Dedicated-Docker" ]
    services:   [ "docker:dind" ]
    rules:
        - if:       '$CI_COMMIT_BRANCH !~ /^\d+\.0$/'
          when:     never
        - if:       '$CI_PIPELINE_SOURCE == "schedule" || $BUILD_IMAGES'
        - changes:  [ "docker/odoo/**/*", ".env" ]
    before_script:
        - apk add --no-cache make > /dev/null
        - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    script:
        - make build push
