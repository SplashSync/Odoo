# Quality checks run directly in the dev image of the registry (same Odoo & Python as production),
# against the sources of the commit and the splashpy release of the image: no Docker, no build.

quality:
    stage:      Quality
    image:      "$IMAGES/dev:$ODOO_VERSION"
    tags:       [ "Dedicated" ]
    variables:
        MYPYPATH:           "$CI_PROJECT_DIR"
        RUFF_CACHE_DIR:     "/tmp/ruff"
        MYPY_CACHE_DIR:     "/tmp/mypy"
    before_script:    []
    script:
        - make quality TOOLS=
